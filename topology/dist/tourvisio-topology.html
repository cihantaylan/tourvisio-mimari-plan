:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #f1f3f6; --line: #e1e4ea; --line2: #cfd4dd;
  --fg: #12151c; --fg2: #4a5262; --fg3: #7a8294; --primary: #2f5bea; --primary-soft: #e8eefe;
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  /* map */
  --canvas: #f3f5f9;
  --plane-top: #fbfcfe; --plane-front: #dde2ea; --plane-right: #cbd1db; --plane-line: #d3d9e3;
  --band-a: rgba(47,91,234,.035); --band-sep: #c3cad6; --tier-text: #55607a;
  --edge: #7b8499; --edge-hl: #2f5bea; --pill-bg: #ffffff; --pill-fg: #3a4252; --pill-line: #cfd5e0;
  --label: #12151c; --label-halo: rgba(246,248,251,.92); --label2: #6a7388;
  --pub-top: #dff5e7; --pub-front: #b3e0c4; --pub-side: #8fcfa8; --pub-ac: #176f3d;
  --int-top: #ffecd2; --int-front: #f6cd96; --int-side: #e9b472; --int-ac: #a84a05;
  --ext-top: #dce9ff; --ext-front: #b1ccf7; --ext-side: #92b5ef; --ext-ac: #1a47a6;
  --fut-top: #eef0f3; --fut-front: #dcdfe5; --fut-side: #ced2da; --fut-ac: #6d7482;
  --gslab: rgba(255,170,70,.10); --gslab-line: #e0a35c; --gslab-front: #f1d9b6; --gslab-side: #e6c593;
  --sel: #2f5bea; --badge: #2f5bea; --badge-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f14; --surface: #151922; --surface2: #1b202b; --line: #262c39; --line2: #343c4d;
    --fg: #eef1f6; --fg2: #aab2c2; --fg3: #7d869a; --primary: #7b9bff; --primary-soft: #1d2744;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
    --canvas: #0f1219;
    --plane-top: #171b25; --plane-front: #222836; --plane-right: #1b2030; --plane-line: #2b3243;
    --band-a: rgba(123,155,255,.05); --band-sep: #38415a; --tier-text: #9aa5c0;
    --edge: #8791a8; --edge-hl: #8aa6ff; --pill-bg: #1b202b; --pill-fg: #c7cedc; --pill-line: #3a4357;
    --label: #eef1f6; --label-halo: rgba(15,18,25,.92); --label2: #8d97ad;
    --pub-top: #1f4a33; --pub-front: #17382a; --pub-side: #102a1f; --pub-ac: #7fe0a6;
    --int-top: #55391a; --int-front: #42290f; --int-side: #331f0a; --int-ac: #ffb766;
    --ext-top: #1f3a6b; --ext-front: #172d54; --ext-side: #0f213f; --ext-ac: #8db4ff;
    --fut-top: #272c36; --fut-front: #1f232c; --fut-side: #181b23; --fut-ac: #8d97ad;
    --gslab: rgba(255,170,70,.07); --gslab-line: #8a6232; --gslab-front: #3a2a14; --gslab-side: #2d200e;
    --sel: #8aa6ff; --badge: #8aa6ff; --badge-fg: #0d0f14;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f14; --surface: #151922; --surface2: #1b202b; --line: #262c39; --line2: #343c4d;
  --fg: #eef1f6; --fg2: #aab2c2; --fg3: #7d869a; --primary: #7b9bff; --primary-soft: #1d2744;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  --canvas: #0f1219;
  --plane-top: #171b25; --plane-front: #222836; --plane-right: #1b2030; --plane-line: #2b3243;
  --band-a: rgba(123,155,255,.05); --band-sep: #38415a; --tier-text: #9aa5c0;
  --edge: #8791a8; --edge-hl: #8aa6ff; --pill-bg: #1b202b; --pill-fg: #c7cedc; --pill-line: #3a4357;
  --label: #eef1f6; --label-halo: rgba(15,18,25,.92); --label2: #8d97ad;
  --pub-top: #1f4a33; --pub-front: #17382a; --pub-side: #102a1f; --pub-ac: #7fe0a6;
  --int-top: #55391a; --int-front: #42290f; --int-side: #331f0a; --int-ac: #ffb766;

  --sel: #8aa6ff; --badge: #8aa6ff; --badge-fg: #0d0f14;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; gap: 20px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand > svg { width: 28px; height: 28px; color: var(--primary); flex: none; }
.brandtext { min-width: 0; }
h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.sub { margin: 1px 0 0; font-size: 12px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; margin-left: 8px; }
.tab { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--fg2); font-weight: 500; }
.tab:hover { background: var(--surface2); color: var(--fg); }
.tab[aria-selected="true"] { color: var(--primary); background: var(--primary-soft); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; padding: 2px; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; }
.seg button { background: none; border: 0; padding: 4px 12px; border-radius: 7px; font-weight: 550; color: var(--fg2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(16,24,40,.12); }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; color: var(--fg2); }
.iconbtn svg { width: 18px; height: 18px; }

.bar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; scrollbar-width: none; }
.bar::-webkit-scrollbar { display: none; }
.lbl { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); flex: none; }
.flows { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg2); font-size: 13px; font-weight: 520; white-space: nowrap; }
.chip:hover { border-color: var(--primary); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0d0f14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0d0f14; } }
.chip .n { font-family: var(--mono); font-size: 11px; opacity: .7; }

body:not([data-view="map"]) #projseg { visibility: hidden; }

/* views */
main { flex: 1; min-height: 0; position: relative; outline: none; }
.view { display: none; height: 100%; }
.view.on { display: flex; }
.mapwrap { position: relative; flex: 1; min-width: 0; background: var(--canvas); overflow: hidden; }
#canvas { position: absolute; inset: 0; cursor: grab; touch-action: none; }
#canvas.drag { cursor: grabbing; }
#canvas svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.hint { position: absolute; left: 16px; bottom: 16px; max-width: calc(100% - 240px); font-size: 12.5px; color: var(--fg2); pointer-events: none; }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); }
.zoom button { min-width: 32px; height: 30px; background: none; border: 0; border-radius: 7px; color: var(--fg2); font-size: 17px; line-height: 1; }
.zoom button:hover { background: var(--surface2); color: var(--fg); }
.zoom .fit { font-size: 12.5px; font-weight: 550; padding: 0 10px; }

.stepbar { position: absolute; left: 14px; top: 12px; width: min(700px, calc(100% - 28px)); display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; box-shadow: var(--shadow); z-index: 2; }
.stepbar[hidden] { display: none; }
.stepbar .sn { flex: none; font-family: var(--mono); font-size: 12px; color: var(--fg3); min-width: 52px; text-align: center; }

<script>
/* Geometry for the topology map: grid layout, isometric projection and edge routing.
 * Pure functions, no DOM. Exposed as the global `TopoGeo` (browser) and module.exports (node).
 *
 * Every node sits on a plane (a flat slab) at a grid position (col, row). The same layout is projected twice:
 * "3d" tilts the planes (yaw and tilt) and extrudes tiles, "2d" is the flat top view of the same grid.

    }

    return d + 'L' + f1(l[0]) + ' ' + f1(l[1]);

  function dedupe(pts) {
    var out = [];
    pts.forEach(function (p) { var l = out[out.length - 1]; if (!l || dist(l, p) > 0.5) out.push(p); });

      }

    }

            pl.push([T.u0 - 2, ve]);

/* TourVisio topology viewer. Builds the scene with TopoGeo and wires the interface. No network, no dependencies. */

  /* ---------- tabs, hash, theme, keys ---------- */

  function showView() {

  }

  function writeHash() {

    if (o.view === '3d' || o.view === '2d') { state.view = 'map'; state.proj = o.view; }

    if (o.node && nodeById[o.node] && !state.flow) state.sel = o.node;
  }

    var ic = t === 'light' ? 'sun' : t === 'dark' ? 'moon' : 'auto', lbl = t === 'light' ? 'Tema: açık' : t === 'dark' ? 'Tema: koyu' : 'Tema: sistem';

  function wire() {

    });

      var inTabs = ev.target.closest && ev.target.closest('.tabs');
      if (ev.key === 'ArrowRight' && state.flow && !inTabs) { ev.preventDefault(); setStep(state.step + 1); }
      else if (ev.key === 'ArrowLeft' && state.flow && !inTabs) { ev.preventDefault(); setStep(state.step - 1); }
      else if (ev.key === '3' && !isMobile) { state.proj = '3d'; showView(); writeHash(); }
      else if (ev.key === '2' && !isMobile) { state.proj = '2d'; showView(); writeHash(); }
    });
    window.addEventListener('resize', function () { checkMobile(); if (!isMobile && !user.moved && $('svg')) fit(); });
    window.addEventListener('hashchange', function () { readHash(); showView(); sync(); });
  }

  function init() {
    var saved = null; try { saved = localStorage.getItem('tvtopo-theme'); } catch (e) { /* ignore */ }
    setTheme(saved === 'light' || saved === 'dark' ? saved : 'auto');
    isMobile = window.innerWidth < 900;
    readHash();
    renderPages(); wireCanvas(); wire();
    showView(); renderChips(); renderPanel(); renderStepbar(); renderList();
    if (!isMobile) { if ($('svg')) applyClasses(); }
    writeHash();
  }

  init();
})();

</script>
